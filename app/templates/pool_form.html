{% extends "base.html" %}
{% block title %}Add a pool — {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Add a pool</h1></div>
<div class="card form-narrow">
  <p class="muted">The pool's specs let us tailor advice and dosing to your water volume.</p>
  <form method="post" action="/pools/new">
    <label for="name">Pool name</label>
    <input type="text" id="name" name="name" placeholder="Back garden pool" required autofocus>

    <label for="volume">Volume</label>
    <div class="row">
      <input type="number" step="any" min="0" id="volume" name="volume" required>
      <select name="volume_unit" aria-label="Volume unit">
        <option value="litres">litres</option>
        <option value="gallons">US gallons</option>
      </select>
    </div>

    <label for="sanitizer">Sanitiser</label>
    <select id="sanitizer" name="sanitizer">
      {% for s in sanitizers %}<option value="{{ s.value }}">{{ s.value }}</option>{% endfor %}
    </select>

    <label for="surface">Surface</label>
    <select id="surface" name="surface">
      {% for s in surfaces %}<option value="{{ s.value }}">{{ s.value }}</option>{% endfor %}
    </select>

    <label class="checkbox"><input type="checkbox" name="indoor" value="true"> Indoor pool</label>

    <label for="pool_type">Pool type</label>
    <select id="pool_type" name="pool_type">
      <option value="">—</option>
      {% for t in pool_types %}<option value="{{ t.value }}">{{ t.value.replace("_", "-") }}</option>{% endfor %}
    </select>

    <label for="shape">Shape</label>
    <select id="shape" name="shape">
      <option value="">—</option>
      {% for s in shapes %}<option value="{{ s.value }}">{{ s.value }}</option>{% endfor %}
    </select>

    <label>Dimensions <span class="muted small">(metres — used to confirm volume)</span></label>
    <div class="row">
      <input type="number" step="any" min="0" name="length_m" placeholder="length / diameter">
      <input type="number" step="any" min="0" name="width_m" placeholder="width">
      <input type="number" step="any" min="0" name="avg_depth_m" placeholder="avg depth">
    </div>

    <label for="location">Location <span class="muted small">(for weather correlation)</span></label>
    <input type="text" id="location" name="location" placeholder="e.g. Brisbane, Australia">
    <p class="muted small">Enter a town/city and we'll look up its coordinates, or set them directly below.</p>
    <div class="row">
      <input type="number" step="any" name="latitude" placeholder="latitude (optional)">
      <input type="number" step="any" name="longitude" placeholder="longitude (optional)">
    </div>

    <button type="submit" class="primary">Create pool</button>
  </form>
</div>
{% endblock %}
