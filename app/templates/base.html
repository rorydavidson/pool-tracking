<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">💧 {{ app_name }}</a>
    <nav>
      {% if user %}
        <a href="/">Dashboard</a>
        <a href="/integrations">Devices</a>
        <span class="who">{{ user.email }}</span>
        <a class="btn-link" href="/logout">Log out</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Pool Tracking — chemical balance monitoring &amp; AI advice for home pools.</span>
  </footer>
</body>
</html>
