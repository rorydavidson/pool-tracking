<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/logo.svg" alt="" width="26" height="26">
      <span>{{ app_name }}</span>
    </a>
    {% if user %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/integrations">Devices</a>
      <span class="who">{{ user.email }}</span>
      <a class="btn-link" href="/logout">Log out</a>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Pool Tracking — water chemistry monitoring &amp; AI advice for home pools.</span>
  </footer>
</body>
</html>
