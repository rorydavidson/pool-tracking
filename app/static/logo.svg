<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pool Tracking logo">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19a8bd"/>
      <stop offset="1" stop-color="#0b6c7e"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M32 5 C32 5 13 29 13 42 a19 19 0 1 0 38 0 C51 29 32 5 32 5 Z"/>
    </clipPath>
  </defs>
  <!-- droplet body -->
  <path d="M32 5 C32 5 13 29 13 42 a19 19 0 1 0 38 0 C51 29 32 5 32 5 Z" fill="url(#drop)"/>
  <!-- water ripples, clipped to the droplet -->
  <g clip-path="url(#dropClip)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M8 41 q6 -5 12 0 t12 0 t12 0 t12 0" stroke-width="3" opacity="0.92"/>
    <path d="M8 49 q6 -5 12 0 t12 0 t12 0 t12 0" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- soft highlight -->
  <ellipse cx="25" cy="24" rx="3.4" ry="5" fill="#ffffff" opacity="0.35" transform="rotate(-20 25 24)"/>
</svg>
