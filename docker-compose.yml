services:
  pool-app:
    build: .
    image: pool-tracking:latest
    ports:
      - "8123:8000"
    env_file:
      - .env
    environment:
      # Keep data inside the named volume regardless of .env.
      DATA_DIR: /data
    volumes:
      - pool_data:/data
    restart: unless-stopped

volumes:
  pool_data:
